name: OpenUnderstand CI

on:
  push:
    branches: [ main, "feature/testing-*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov coverage flake8 cosmic-ray pynguin
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Linting (Flake8 Quality Gate)
      run: |
        flake8 openunderstand/utils/utilities.py --count --statistics

    - name: Run Unit Tests & Verify Coverage Gates
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/openunderstand
      run: |
        python -m pytest --cov=openunderstand.utils.utilities --cov-branch --cov-fail-under=80 test_utilities.py