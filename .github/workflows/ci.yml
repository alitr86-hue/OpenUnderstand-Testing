name: OpenUnderstand CI

on:
  push:
    branches: [ main, "feature/testing-*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linting (Flake8 Quality Gate)
      run: |
        flake8 openunderstand/utils/utilities.py --count --statistics || true

    - name: Run Unit Tests & Verify Coverage Gates
      env:
        PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/openunderstand
      run: |
        python -m pytest test_utilities.py -v --cov=openunderstand.utils.utilities --cov-branch --cov-report=term-missing --cov-report=html:HTML_Coverage_Report --cov-fail-under=60

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: HTML_Coverage_Report
